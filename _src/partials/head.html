<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="theme-color" content="#0d0b1f">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="High Fifteen">
  <meta property="og:locale" content="en_GB">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{ogimage}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{ogimage}}">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preload" href="assets/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/plus-jakarta-sans-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/instrument-serif-italic.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    /* Runs before first paint: picks the intro (first visit in a session) or the
       page-to-page curtain, and switches motion on only when it is wanted. */
    (function (d) {
      var h = d.documentElement; h.classList.add('js');
      try {
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        /* Intro + page curtain only on desktop: on phones they just feel like lag. */
        var desk = window.matchMedia('(hover: hover) and (pointer: fine) and (min-width: 1024px)').matches;
        if (!reduce) h.classList.add('motion-ok');
        if (desk) h.classList.add('is-desktop');
        var s = window.sessionStorage;
        if (!reduce && desk && !s.getItem('hf-seen')) h.classList.add('is-loading');
        else if (!reduce && desk && s.getItem('hf-nav')) h.classList.add('is-entering');
      } catch (e) {}
      /* Safety net: never leave content hidden if a script fails to load. */
      setTimeout(function () { if (!h.classList.contains('ready')) h.classList.remove('is-loading', 'is-entering', 'motion-ok'); }, 3500);
    })(document);
  </script>
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/main.css">
  {{schema}}
</head>
<body class="{{accent}} {{bodyclass}}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="preloader" aria-hidden="true">
    <div class="preloader__inner">
      <img class="preloader__logo" src="assets/img/logo-white.png" alt="" width="1052" height="617">
      <div class="preloader__count"><span data-count-target>00</span></div>
      <div class="preloader__bar"><i></i></div>
      <div class="preloader__label">Inclusive high performance</div>
    </div>
  </div>
  <div class="preloader__panel" aria-hidden="true"></div>
  <div class="curtain" aria-hidden="true"><img class="curtain__logo" src="assets/img/logo-white.png" alt="" width="1052" height="617"></div>
  <div class="cursor" aria-hidden="true"><div class="cursor__dot"></div><div class="cursor__label"></div></div>
