<section class="section section--flush-top t-paper">
  <div class="container">
    <div class="cta-band t-ink grain {{acc}}" data-header="dark">
      <div class="atmos" aria-hidden="true"><span class="orb"></span><span class="orb"></span><span class="orb"></span></div>
      <p class="eyebrow">{{eyebrow}}</p>
      <h2 class="h-l" data-split>{{heading}}</h2>
      <p class="lead muted measure">{{text}}</p>
      <div class="btn-row btn-row--stack" style="justify-content:center">
        <x-btn href="{{href}}" variant="mint">{{label}}</x-btn>
        <x-btn href="index.html#pressure-check" variant="ghost" icon="spark">Take the Pressure Check</x-btn>
      </div>
    </div>
  </div>
</section>
