<div class="newsletter" data-reveal>
  <div class="newsletter__art"><x-img name="unfiltering-pattern" alt="Detail of one of Vanessa's colourful paintings" sizes="(min-width: 900px) 34vw, 100vw"></div>
  <div class="newsletter__inner">
    <p class="eyebrow">Bi-monthly newsletter</p>
    <h2 class="h-m">Subscribe to <span class="it">‘Unfiltering’.</span></h2>
    <p class="muted">Positive psychology, leadership and workplace culture insights, creativity and mindset reframes. ‘Unfiltering’ is letting go of the filters we put on ourselves to fit in: honest reflection and coaching insight, without the ‘shoulds’.</p>
    <form class="mini-form" style="background:#fff;box-shadow:inset 0 0 0 1px var(--line)" data-newsletter>
      <label class="sr-only" for="nl-email-2">Your email</label>
      <input id="nl-email-2" type="email" name="email" placeholder="you@company.com" required autocomplete="email" style="color:var(--ink)">
      <button class="btn btn--primary btn--sm" type="submit"><span>Sign me up</span><span class="btn__ic">{{i:arrow}}</span></button>
    </form>
  </div>
</div>
